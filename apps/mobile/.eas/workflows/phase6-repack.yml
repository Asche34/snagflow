name: Phase 6 internal APK

# Manual-only packaging. No GitHub trigger, deployment, OTA update or store submission.
jobs:
  native_base:
    type: get-build
    params:
      platform: android
      profile: preview
      distribution: internal
      app_identifier: com.snagflow.app
      app_version: '1.0.4'
      app_build_version: '5'
      git_commit_hash: 4b77363fcc8dcf973e5f6843b211ca9afad5dc29
      fingerprint_hash: 3d7a13e86fd5a435272f95ed7935b0b2537910cc
      wait_for_in_progress: true

  package_apk:
    needs: [native_base]
    if: ${{ needs.native_base.outputs.build_id }}
    type: repack
    environment: preview
    params:
      build_id: ${{ needs.native_base.outputs.build_id }}
      profile: preview
      js_bundle_only: true
      embed_bundle_assets: true
      message: Phase 6 offline and push with cold-start tap preservation
