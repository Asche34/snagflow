# SnagFlow Supabase local stack configuration.
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "snagflow"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "snagflow://auth/callback",
]
# Internal tool: no public signup. Users are created by admins via invites.
enable_signup = false
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.mfa]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"
# Private buckets must be created via migration; nothing public by default.

[realtime]
enabled = true

[analytics]
enabled = false
