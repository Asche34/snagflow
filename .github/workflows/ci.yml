name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm turbo run build

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Unit tests
        run: pnpm --filter @snagflow/shared test

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Placeholder env so `next build` succeeds without a real project.
      - name: Build
        run: pnpm turbo run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  database:
    name: Supabase migrations + DB/RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations + seed
        run: supabase db reset

      - name: DB / RLS / workflow tests
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase-test.env"
          source "$RUNNER_TEMP/supabase-test.env"
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" pnpm --filter @snagflow/db-tests test

      - name: SQL authorization regressions
        run: psql -X -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/sql/authorization.sql

  e2e:
    name: Playwright E2E (real browser)
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations + seed
        run: supabase db reset

      # The local stack generates its own keys, so read them from the running
      # stack and inject them into the build rather than hardcoding a placeholder.
      - name: Capture Supabase keys
        id: keys
        run: |
          supabase status -o env > supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_OUTPUT"
          # `supabase status -o env` wraps values in double quotes; strip them so the
          # inlined anon key is a bare string and the build does not bake quotes in.
          ANON=$(grep '^ANON_KEY=' supabase.env | cut -d= -f2- | sed 's/^"//; s/"$//')
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON" >> "$GITHUB_OUTPUT"
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> "$GITHUB_OUTPUT"
          echo "NEXT_PUBLIC_DEMO_ACCOUNTS=1" >> "$GITHUB_OUTPUT"

      - name: Build web app
        run: pnpm turbo run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.keys.outputs.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.keys.outputs.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ steps.keys.outputs.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_DEMO_ACCOUNTS: ${{ steps.keys.outputs.NEXT_PUBLIC_DEMO_ACCOUNTS }}

      - name: Install Playwright browsers
        run: pnpm --filter @snagflow/e2e exec npx playwright install --with-deps chromium

      - name: Start web app
        run: pnpm --filter web start --port 3000 &

      - name: Wait for the web app
        run: for i in $(seq 1 30); do curl -sf http://localhost:3000/login && break; sleep 1; done

      - name: Run E2E suite
        run: pnpm --filter @snagflow/e2e test
        env:
          E2E_CHANNEL: bundled

      - name: Fieldwork UI regressions (isolated fixture transport)
        run: pnpm --filter @snagflow/e2e test:ui
        env:
          E2E_CHANNEL: bundled
